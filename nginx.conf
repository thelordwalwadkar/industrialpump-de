# Static hosting of the Astro build: clean URLs (/pumpen/marken/lowara → lowara.html), German 404, sensible caching.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # canonical URLs have no trailing slash
  rewrite ^/(.+)/$ /$1 permanent;

  location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location /img/    { expires 7d; add_header Cache-Control "public"; }
  location /        { try_files $uri $uri.html $uri/index.html =404; }

  error_page 404 /404.html;
}
