# One-click hosting from the GitHub repo (also works on Cloudflare Pages: build `npm run build`, output `dist`).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  PUBLIC_STAGING = "1"   # public test deployment: noindex. Remove (or set 0) when the real domain goes live.

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
