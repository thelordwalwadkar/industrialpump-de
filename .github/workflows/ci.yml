name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx astro check
      - run: npm run build            # includes JSON-LD validation, link/SEO checks
      - run: npm run test:fixtures    # all 14 templates
      - run: npm run verify:model
